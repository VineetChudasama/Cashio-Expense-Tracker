<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cashio-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="cashio-arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cashio-wallet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#011A14" />
    </linearGradient>
    <linearGradient id="cashio-note-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <filter id="cashio-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle (optional for safe-zone) -->
  <rect width="512" height="512" rx="128" fill="#02221D" />

  <!-- Outer 'C' emblem -->
  <path d="M 330 145 A 150 150 0 1 0 330 367" fill="none" stroke="url(#cashio-ring-grad)" stroke-width="48" stroke-linecap="round" />

  <!-- Chart growth bars inside C -->
  <rect x="180" y="270" width="22" height="60" rx="8" fill="#10B981" opacity="0.85" />
  <rect x="215" y="235" width="22" height="95" rx="8" fill="#10B981" opacity="0.9" />
  <rect x="250" y="195" width="22" height="135" rx="8" fill="#34D399" />

  <!-- Growth Trend Arrow -->
  <path d="M 175 285 L 260 200 L 295 235 L 345 185" fill="none" stroke="url(#cashio-arrow-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="335,175 365,180 355,210" fill="#34D399" />
  <circle cx="175" cy="285" r="8" fill="#6EE7B7" />
  <circle cx="260" cy="200" r="8" fill="#6EE7B7" />
  <circle cx="295" cy="235" r="8" fill="#6EE7B7" />

  <!-- Currency Note sticking out of wallet -->
  <path d="M 285 240 L 355 230 L 375 310 L 305 320 Z" fill="url(#cashio-note-grad)" rx="8" />
  <!-- Currency symbol on note -->
  <text x="325" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#064E3B" text-anchor="middle">₹</text>

  <!-- Modern Wallet Flap -->
  <path d="M 220 310 Q 320 290 390 315 C 405 320 410 335 410 355 C 410 395 385 415 345 415 L 235 415 C 195 415 180 390 180 365 C 180 330 200 315 220 310 Z" fill="url(#cashio-wallet-grad)" stroke="#10B981" stroke-width="6" />

  <!-- Wallet Stitching Line -->
  <path d="M 225 322 Q 315 304 382 327" fill="none" stroke="#34D399" stroke-width="3.5" stroke-dasharray="6,6" />

  <!-- Wallet Button Clasp -->
  <circle cx="340" cy="370" r="16" fill="#E2E8F0" stroke="#10B981" stroke-width="3" />
  <circle cx="340" cy="370" r="8" fill="#94A3B8" />
</svg>